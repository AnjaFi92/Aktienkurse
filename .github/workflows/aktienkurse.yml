name: Aktienkurse per Mail

on:
  workflow_dispatch:   # wird von cron-job.org (oder manuell) gestartet

jobs:
  kurse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install yfinance

      - run: python aktienkurse_mail.py
        env:
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_APP_PASSWORT: ${{ secrets.GMAIL_APP_PASSWORT }}
          EMPFAENGER: ${{ secrets.EMPFAENGER }}
